version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: proyecto2_mysql_dw
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: airflow_meta
    ports:
      - "3307:3306"
    volumes:
      - mysql_dw_data:/var/lib/mysql
      - ./sql/create_dw.sql:/docker-entrypoint-initdb.d/01_create_dw.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:3.1.8-python3.10
    container_name: proyecto2_airflow_init
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://root:${DB_PASSWORD:-root}@mysql:3306/airflow_meta
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql requests python-dotenv
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Inicializando base de datos de Airflow..."
        airflow db migrate
        echo "¡Airflow inicializado exitosamente!"
    restart: "no"

  airflow-webserver:
    image: apache/airflow:3.1.8-python3.10
    container_name: proyecto2_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://root:${DB_PASSWORD:-root}@mysql:3306/airflow_meta
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - ETL_PROJECT_ROOT=/opt/airflow
      - PYTHONPATH=/opt/airflow
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-dw_calidad_agua_colombia}
      - API_COLOMBIA_BASE_URL=https://api-colombia.com/api/v1
      - INJECT_CRITICAL_FAILURE=${INJECT_CRITICAL_FAILURE:-false}
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql requests python-dotenv
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./docs:/opt/airflow/docs
      - ./src:/opt/airflow/src
      - ./gx:/opt/airflow/gx
      - ./sql:/opt/airflow/sql
    command: api-server
    restart: always

  airflow-scheduler:
    image: apache/airflow:3.1.8-python3.10
    container_name: proyecto2_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://root:${DB_PASSWORD:-root}@mysql:3306/airflow_meta
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution/
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - ETL_PROJECT_ROOT=/opt/airflow
      - PYTHONPATH=/opt/airflow
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-dw_calidad_agua_colombia}
      - API_COLOMBIA_BASE_URL=https://api-colombia.com/api/v1
      - INJECT_CRITICAL_FAILURE=${INJECT_CRITICAL_FAILURE:-false}
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql requests python-dotenv
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./docs:/opt/airflow/docs
      - ./src:/opt/airflow/src
      - ./gx:/opt/airflow/gx
      - ./sql:/opt/airflow/sql
    command: scheduler
    restart: always

  airflow-dag-processor:
    image: apache/airflow:3.1.8-python3.10
    container_name: proyecto2_airflow_dag_processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://root:${DB_PASSWORD:-root}@mysql:3306/airflow_meta
      - AIRFLOW__CORE__FERNET_KEY=fLJTSG37YolLbAQFEV-3HNwxPV__tgTZcx8OjnJiEf8=
      - AIRFLOW__API_AUTH__JWT_SECRET=jRbS5t7fnHyPWW6KayB-FLredqvQOozwNvOnjkHZ6h0=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - ETL_PROJECT_ROOT=/opt/airflow
      - PYTHONPATH=/opt/airflow
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql great_expectations pyarrow pymysql requests python-dotenv
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./docs:/opt/airflow/docs
      - ./src:/opt/airflow/src
      - ./gx:/opt/airflow/gx
      - ./sql:/opt/airflow/sql
    command: dag-processor
    restart: always

volumes:
  mysql_dw_data:
